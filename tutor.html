<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T Nathan Oldridge: Tutor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            line-height: 1.7;
        }

        /* Header: Just your name in the corner */
        header {
            padding: 30px 40px;
        }

        .name-logo {
            font-weight: 300;
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
        }

        /* Main Content Area */
        .content-wrapper {
            /* 15% margins on either side */
            width: 70%;
            max-width: 850px;
            margin: 40px auto 100px auto; 
        }

        /* The True Title */
        h1 {
            color: #ffffff;
            font-weight: 400;
            font-size: 2.2rem;
            margin-bottom: 2rem;
            letter-spacing: -0.5px;
        }

        p {
            margin-bottom: 1.5rem;
            color: #bbbbbb;
            font-size: 1.1rem;
        }

        a, a:visited, a:hover, a:active, a:focus {
            color: #B2CEFE; /* Baby Blue / Periwinkle */
            text-decoration: underline;
            transition: none; 
        }

        .back-link {
            display: inline-block;
            margin-top: 50px;
            color: #B2CEFE;
            text-decoration: none;
            font-size: 0.9rem;
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s;
        }

        .back-link:hover {
            border-color: #007bff;
        }

        /* Mobile adjustments: shift to 5% margins */
        @media (max-width: 768px) {
            header {
                padding: 20px;
                text-align: center;
            }
            .content-wrapper {
                width: 90%;
                margin-top: 20px;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="name-logo">T NATHAN OLDRIDGE</a>
    </header>

    <main class="content-wrapper">
        <h1>Nathan Oldridge used to tutor Chemistry and Math in Toronto, Canada</h1>
        
        <p>
            Currently I'm not doing that.
        </p>

        <p>
            But one day I could be talked into resuming...
        </p>
        
        <a href="index.html" class="back-link">← Return Home</a>
    </main>

</body>
</html>
