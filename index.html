<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio - Horizontal Split</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: #121212; 
            color: #e0e0e0;
            overflow-x: hidden;
        }

        h1 {
            margin-top: 40px; /* Pushes name to the top */
            margin-bottom: auto; 
            font-weight: 300;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .container-wrapper {
            display: flex;
            align-items: center;
            flex-grow: 2; 
            width: 95%;
            max-width: 1000px;
        }

        .container {
            display: flex;
            gap: 20px;
            width: 100%;
            align-items: stretch; /* Ensures all columns are same height */
        }

        /* The vertical column that holds the two stacked boxes */
        .split-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            flex: 1;
            padding: 80px 10px; 
            text-align: center;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            text-decoration: none;
            color: #bbbbbb;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Adjusts the height of the split cards so they fit in the same space */
        .split-card {
            padding: 0 10px; /* Vertical height determined by flex-grow */
        }

        .card:hover {
            background: #252525;
            border-color: #007bff;
            color: #ffffff;
            transform: translateY(-5px);
        }

        .card h2 {
            font-size: 1rem;
            margin: 0;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 800px) {
            .container {
                flex-direction: column;
            }
            .card {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>

    <h1>My Name</h1>

    <div class="container-wrapper">
        <div class="container">
            <a href="#" class="card"><h2>Teacher</h2></a>
            
            <div class="split-column">
                <a href="#" class="card split-card"><h2>Chemistry YouTuber</h2></a>
                <a href="#" class="card split-card"><h2>Math YouTuber</h2></a>
            </div>

            <a href="#" class="card"><h2>Tutor</h2></a>
            <a href="#" class="card"><h2>Trader</h2></a>
        </div>
    </div>

</body>
</html>
