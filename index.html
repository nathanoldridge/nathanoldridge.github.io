<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nathan Oldridge - Teacher, Tutor, YouTuber, Trader in Toronto</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: #121212; 
            color: #e0e0e0;
            overflow-x: hidden;
        }

        h1 {
            margin-top: 40px;
            margin-bottom: auto; 
            font-weight: 300;
            letter-spacing: 2px;
            color: #ffffff;
            text-align: center;
        }

        .container-wrapper {
            display: flex;
            align-items: center;
            flex-grow: 2; 
            width: 95%;
            max-width: 1000px;
        }

        .container {
            display: flex;
            gap: 20px;
            width: 100%;
            align-items: stretch;
        }

        .split-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            flex: 1;
            padding: 80px 10px; 
            text-align: center;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            text-decoration: none;
            color: #bbbbbb;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Specific styling for the Trader box with background image */
        .trader-card {
            background-image: 
                linear-gradient(rgba(30, 30, 30, 0.8), rgba(30, 30, 30, 0.8)), 
                url('https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/%E6%88%90%E5%8A%9F%E7%9A%84%E9%8C%98%E5%AD%90%E7%B7%9A%E5%BD%A2%E6%85%8B.png/640px-%E6%88%90%E5%8A%9F%E7%9A%84%E9%8C%98%E5%AD%90%E7%B7%9A%E5%BD%A2%E6%85%8B.png');
            background-size: cover;
            background-position: center;
        }

        .split-card {
            padding: 0 10px;
        }

        .card:hover {
            background-color: #252525;
            border-color: #007bff;
            color: #ffffff;
            transform: translateY(-5px);
        }

        /* Hover effect for Trader card to slightly lighten the image */
        .trader-card:hover {
            background-image: 
                linear-gradient(rgba(30, 30, 30, 0.6), rgba(30, 30, 30, 0.6)), 
                url('https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/%E6%88%90%E5%8A%9F%E7%9A%84%E9%8C%98%E5%AD%90%E7%B7%9A%E5%BD%A2%E6%85%8B.png/640px-%E6%88%90%E5%8A%9F%E7%9A%84%E9%8C%98%E5%AD%90%E7%B7%9A%E5%BD%A2%E6%85%8B.png');
        }

        .card h2 {
            font-size: 1rem;
            margin: 0;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 1; /* Ensures text stays above background */
        }

        @media (max-width: 800px) {
            .container {
                flex-direction: column;
            }
            .card {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>

    <h1>T Nathan Oldridge<br />M.Sc., B.Ed., OCT</h1>

    <div class="container-wrapper">
        <div class="container">
            <a href="#" class="card"><h2>Teacher</h2></a>
            
            <div class="split-column">
                <a href="#" class="card split-card"><h2>Chemistry YouTuber</h2></a>
                <a href="#" class="card split-card"><h2>Math YouTuber</h2></a>
            </div>

            <a href="#" class="card"><h2>Tutor</h2></a>
            <a href="#" class="card trader-card"><h2>Trader</h2></a>
        </div>
    </div>

</body>
</html>
